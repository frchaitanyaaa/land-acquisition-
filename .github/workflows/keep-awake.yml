# Keeps the free Render demo awake 08:00–24:00 IST (it sleeps after 15 min without visitors; waking takes ~3 min)
# and reports its health. Awake 24×7 would use ~744 of Render's 750 free hours a month — too close to the limit,
# after which Render suspends the service until next month. This window uses ~505 h. Overnight the first visitor
# waits ~3 min; to wake it on demand: Actions → Keep demo awake → Run workflow.
# GitHub may delay scheduled runs; an external pinger (UptimeRobot / cron-job.org, see deploy/README.md) is the
# primary keep-awake, this is the backup and the health log.
# URL: repository variable PUBLIC_URL, else the default below.
name: Keep demo awake

on:
  schedule:
    # Cron is UTC; IST = UTC + 5:30. Together: every 10 min from 08:00 to 23:50 IST.
    - cron: '30,40,50 2 * * *'
    - cron: '*/10 3-17 * * *'
    - cron: '0,10,20 18 * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping and report
        env:
          URL: ${{ vars.PUBLIC_URL || 'https://bhoomisetu-latest.onrender.com' }}
        run: |
          # A sleeping instance takes a few minutes to answer; keep trying for up to ~6 minutes.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$URL/") || code=000
            [ "$code" = 200 ] && break
            echo "attempt $i: HTTP $code — waiting"; sleep 15
          done
          health=$(curl -s -m 30 "$URL/api/v1/health" | grep -o '"status":"[a-z]*","db":"[a-z]*"' || echo unreachable)
          build=$(curl -s -m 30 "$URL/api/v1/health" | grep -o '"build":"[0-9a-f]\{7\}' | cut -d'"' -f4 || true)
          ledger=$(curl -s -m 30 "$URL/api/v1/public/chain-summary" | grep -o '"anchored":[0-9]*,"pending":[0-9]*' || echo unavailable)
          # As an annotation, so the result is readable from the run page without opening the log.
          echo "::notice title=Demo status::landing HTTP $code · api $health · ledger $ledger · build ${build:-unknown}"
          [ "$code" = 200 ] || { echo "::error::$URL did not answer with 200"; exit 1; }
