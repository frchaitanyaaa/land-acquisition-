# Builds the all-in-one demo image (deploy/cloud/) and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/bhoomisetu:latest
# Render's free web service runs that image (deploy/README.md §A). If the repository secret RENDER_DEPLOY_HOOK
# is set (Render → service → Settings → Deploy Hook), Render is told to pull the new image after each build.
name: Deploy (cloud image)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bhoomisetu" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/cloud/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell Render to redeploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK not set — image published, Render not notified (see deploy/README.md)."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "::notice::Render redeploy requested."
          fi
