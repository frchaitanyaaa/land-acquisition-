name: bhoomisetu

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_NAME: bhoomisetu
      DB_OWNER_PASSWORD: owner_pass
      DB_APP_PASSWORD: app_pass
      DB_WORKER_PASSWORD: worker_pass
    ports: ['5432:5432']
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-bhoomisetu.sh:ro
      - ./docker/postgres/roles.sql:/bhoomisetu/roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bhoomisetu']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO no longer publishes images on Docker Hub or quay.io (pull access denied / 401 as of
  # 2026), so we use Chainguard's build of the same server. Distroless: no shell, no healthcheck.
  minio:
    image: chainguard/minio
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio_data:/data

  # One-shot: creates the document bucket, then exits. Retries until MinIO is accepting requests.
  minio-init:
    image: chainguard/minio-client
    depends_on: [minio]
    restart: on-failure
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: ['mb', '--ignore-existing', 'local/bhoomisetu-docs']

  mailhog:
    image: mailhog/mailhog
    ports: ['1025:1025', '8025:8025']

  chain:
    build: ./packages/chain
    ports: ['8545:8545']

volumes:
  pg_data:
  minio_data:
